<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flora & Fables 3D</title>
    <link rel="stylesheet" href="world.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <div id="ui-layer">
        <header>
            <h1 id="game-logo">Flora & Fables</h1>
            <div class="currency">
                <div class="stat-pill"><span class="dot-seed"></span> <span id="seed-count">0</span></div>
                <div class="stat-pill"><span class="dot-fruit"></span> <span id="fruit-count">0</span></div>
            </div>
        </header>

        <main id="ui-content">
            <!-- ALCHEMY VIEW -->
            <div id="view-alchemy" class="view active">
                <h2 class="title-3d">Alchemy Lab</h2>
                <p class="subtitle">Pilih 3 bahan untuk meracik benih.</p>
                
                <div id="ingredients-container"></div>
                <button id="brew-btn" class="primary-btn" disabled>RACIK BENIH</button>
            </div>

            <!-- FARM VIEW -->
            <div id="view-farm" class="view">
                <h2 class="title-3d">Floating Farm</h2>
                <p class="subtitle">Ketuk tanah untuk menanam & menyiram.</p>
                <div id="farm-click-zones">
                    <div class="plot-zone" data-index="0"></div>
                    <div class="plot-zone" data-index="1"></div>
                    <div class="plot-zone" data-index="2"></div>
                    <div class="plot-zone" data-index="3"></div>
                    <div class="plot-zone" data-index="4"></div>
                </div>
            </div>

            <!-- COLLECTION VIEW -->
            <div id="view-collection" class="view">
                <h2 class="title-3d">Collection</h2>
                <div id="collection-grid"></div>
            </div>
        </main>

        <nav id="bottom-nav">
            <button class="nav-btn active" data-target="view-alchemy">ALCHEMY</button>
            <button class="nav-btn" data-target="view-farm">FARM</button>
            <button class="nav-btn" data-target="view-collection">COLLECTION</button>
        </nav>
    </div>

    <div id="modal-overlay" class="hidden">
        <div id="modal-content"></div>
    </div>

    <script src="art.js"></script>
    <script src="art2.js"></script>
    <script src="ui.js"></script>
</body>
</html>
