<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flora & Fables 3D</title>
    <link rel="stylesheet" href="world.css">
    <!-- Import Three.js untuk rendering 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- Kanvas 3D Utama -->
    <canvas id="game-canvas"></canvas>

    <!-- Overlay UI -->
    <div id="ui-layer">
        <header>
            <h1 id="game-logo">Flora & Fables</h1>
            <div class="currency">
                <span id="seed-count">🌱 0</span>
                <span id="fruit-count">🍎 0</span>
            </div>
        </header>

        <main id="ui-content">
            <!-- View Alchemy -->
            <div id="view-alchemy" class="view active">
                <h2 class="title-3d">Alchemy Lab</h2>
                <p class="subtitle">Sentuh 3 bahan untuk meracik benih 3D.</p>
                <div id="ingredients-container"></div>
                <button id="brew-btn" class="primary-btn" disabled>Brew Seed</button>
            </div>

            <!-- View Farm -->
            <div id="view-farm" class="view">
                <h2 class="title-3d">Floating Farm</h2>
                <p class="subtitle">Tanam dan siram benih Anda.</p>
                <div id="farm-container"></div>
            </div>

            <!-- View Collection -->
            <div id="view-collection" class="view">
                <h2 class="title-3d">My Collection</h2>
                <div id="collection-grid"></div>
            </div>
        </main>

        <!-- Navigasi Bawah -->
        <nav id="bottom-nav">
            <button class="nav-btn active" data-target="view-alchemy">
                <span class="icon">⚗️</span><span>Alchemy</span>
            </button>
            <button class="nav-btn" data-target="view-farm">
                <span class="icon">🏝️</span><span>Farm</span>
            </button>
            <button class="nav-btn" data-target="view-collection">
                <span class="icon">📖</span><span>Collection</span>
            </button>
        </nav>
    </div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="hidden">
        <div id="modal-content"></div>
    </div>

    <!-- Scripts -->
    <script src="art.js"></script>
    <script src="art2.js"></script>
    <script src="ui.js"></script>
</body>
</html>
