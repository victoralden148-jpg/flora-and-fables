<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cdeede">
  <title>Flora &amp; Fables</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header: tap the logo 5x quickly for the dev prompt -->
  <header class="top">
    <h1 id="logo">🌸 Flora &amp; Fables</h1>
    <div id="stats" class="pill">0 / 24</div>
  </header>

  <main>
    <!-- ALCHEMY -->
    <section id="page-alchemy" class="page active">
      <div class="cauldron" aria-hidden="true">🫕</div>
      <div id="slots" class="slots"></div>
      <div id="ingredients" class="ingredients"></div>
      <div class="row">
        <button id="btn-clear" class="btn ghost">Clear</button>
        <button id="btn-mix" class="btn">Mix</button>
      </div>
      <p id="alchemy-msg" class="msg">Pick 3 ingredients, then mix.</p>
      <h2>Recipe book</h2>
      <div id="recipes" class="recipes"></div>
    </section>

    <!-- FARM -->
    <section id="page-farm" class="page">
      <p class="msg">Tap a plot to plant, tap again to water, then harvest.</p>
      <div id="plots" class="plots"></div>
      <h2>Seed bag</h2>
      <div id="seedbag" class="recipes"></div>
    </section>

    <!-- COLLECTION -->
    <section id="page-collection" class="page">
      <div id="cards" class="cards"></div>
    </section>
  </main>

  <nav class="nav">
    <button data-page="alchemy" class="active">🧪<span>Alchemy</span></button>
    <button data-page="farm">🌱<span>Farm</span></button>
    <button data-page="collection">📖<span>Cards</span></button>
  </nav>

  <div id="modal" class="modal hidden"><div id="modal-body" class="modal-body"></div></div>
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
